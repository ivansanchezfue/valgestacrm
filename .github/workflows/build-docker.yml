name: Build and Release Docker Image

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Build Docker image (without BuildKit for consistency)
      run: |
        DOCKER_BUILDKIT=0 docker build \
          --build-arg VITE_SUPABASE_URL="${{ secrets.VITE_SUPABASE_URL }}" \
          --build-arg VITE_SUPABASE_PUBLISHABLE_KEY="${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}" \
          -t valgestacrm:latest \
          .
    
    - name: Export Docker image to tar
      run: |
        docker save -o valgestacrm-docker-image.tar valgestacrm:latest
        
    - name: Compress tar with gzip
      run: |
        gzip -9 valgestacrm-docker-image.tar
        mv valgestacrm-docker-image.tar.gz valgestacrm-docker-image.tar.gz
        
    - name: Get image size
      run: |
        echo "=== Tamaños de archivo ==="
        ls -lh valgestacrm-docker-image.tar.gz
        echo ""
        echo "Descomprimido sería: $(gzip -l valgestacrm-docker-image.tar.gz | tail -1 | awk '{print $2}') bytes"
        
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: valgestacrm-docker-image
        path: valgestacrm-docker-image.tar.gz
        retention-days: 30